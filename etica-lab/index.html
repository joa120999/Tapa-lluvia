{id:'o05',t:'op',q:'¿Qué hacen los medios masivos que puede influir en la sociedad?',o:['Presentan siempre todas las noticias de modo idéntico','Seleccionan y presentan noticias','Eligen legalmente a los gobernantes','Impiden necesariamente el debate público'],a:1,why:'Radio, televisión, diarios e Internet intervienen seleccionando y presentando información.',key:'Medios'},
{id:'o06',t:'op',q:'En los noticieros aparecen todos los días debates sobre inundaciones. El público empieza a considerarlas un tema prioritario. ¿Qué concepto es?',o:['La agenda setting','El derecho canónico','La afiliación partidaria','El primado jurisdiccional'],a:0,why:'Agenda setting: al destacar determinados temas, los medios pueden influir en cuáles ocupan un lugar central en la opinión pública.',key:'Agenda setting'},
{id:'o07',t:'op',q:'La agenda setting se refiere principalmente a que los medios...',o:['Fijan legalmente cómo debe votar cada persona','Pueden influir sobre qué asuntos considera importantes la sociedad','Crean partidos políticos','Garantizan acuerdo absoluto'],a:1,why:'La idea se centra en la relevancia de los temas seleccionados, no en imponer necesariamente una opinión única.',key:'Agenda setting'},
{id:'o08',t:'op',q:'¿Cuál de los siguientes intereses puede orientar la selección de noticias?',o:['Conseguir más audiencia o rating','El derecho canónico','La disciplina eclesiástica','La afiliación obligatoria'],a:0,why:'La guía menciona explícitamente la búsqueda de rating o una mayor audiencia.',key:'Intereses mediáticos'},
{id:'o09',t:'op',q:'¿Qué otros intereses pueden influir en los medios?',o:['Solo los del público adolescente','Los de los propietarios y su manera de interpretar la realidad','Únicamente los religiosos','Ninguno: los medios no eligen temas'],a:1,why:'Los propietarios, los sectores con los que se relacionan y su interpretación de la realidad también influyen.',key:'Intereses mediáticos'},
{id:'o10',t:'op',q:'¿Cuál de estas frases resume mejor la primera parte de la guía?',o:['La opinión pública no se relaciona con la política','La opinión pública permite participar y los medios pueden influir en los temas que se consideran importantes','Los medios reemplazan a los partidos políticos','Los medios deciden todas las opiniones individuales'],a:1,why:'La idea principal combina participación ciudadana e influencia de los medios en los temas sociales.',key:'Síntesis'},
{id:'o11',t:'op',q:'Una ciudadana opina públicamente sobre la gestión municipal, sin pertenecer a un partido. ¿Participa políticamente?',o:['No, porque no se afilió','Sí: expresar ideas sobre asuntos públicos es participación','No, porque no es dirigente','Solo si trabaja en un medio'],a:1,why:'La guía considera la expresión de opiniones sobre asuntos públicos como forma de participación política.',key:'Aplicación'},
{id:'o12',t:'op',q:'¿Cuáles son ejemplos de medios masivos mencionados?',o:['Radio, televisión, diarios e Internet','Solamente las escuelas','Únicamente las elecciones','Solo las fichas de afiliación'],a:0,why:'Los cuatro medios aparecen expresamente en la sección sobre construcción de la opinión pública.',key:'Medios'},
// Partidos políticos — fuente: sección 2
{id:'p01',t:'pa',q:'¿Cuál es la función central de los partidos políticos?',o:['Representar intereses, influir en el gobierno y buscar cargos de poder','Administrar exclusivamente iglesias','Prohibir opiniones diferentes','Reemplazar a todos los ciudadanos'],a:0,why:'Son organizaciones que canalizan intereses, proponen ideas y generalmente buscan ejercer el poder mediante elecciones.',key:'Definición'},
{id:'p02',t:'pa',q:'La existencia de distintos partidos expresa...',o:['La falta de opiniones en una sociedad','El pluralismo: diversidad de intereses e ideas','La imposibilidad de votar','La autoridad imperial'],a:1,why:'El término partido remite a una parte de lo político, ligada a distintos intereses e ideas democráticas.',key:'Pluralismo'},
{id:'p03',t:'pa',q:'Una plataforma política es...',o:['Un programa de ideas y objetivos de un partido','Una ficha de afiliación personal','Un cargo dentro de la Iglesia','El resultado de una elección'],a:0,why:'Entre las funciones de los partidos figura proponer ideas y objetivos mediante sus plataformas políticas.',key:'Plataformas'},
{id:'p04',t:'pa',q:'¿Qué diferencia a un simpatizante de un afiliado?',o:['El simpatizante está afiliado formalmente y el afiliado no','El afiliado se compromete formalmente mediante una ficha; el simpatizante se identifica y suele votarlo','El simpatizante es siempre presidente','No existe ninguna diferencia'],a:1,why:'La diferencia clave es el compromiso formal del afiliado.',key:'Organización'},
{id:'p05',t:'pa',q:'¿Cuál de estos cargos puede desempeñar un dirigente local?',o:['Intendente o concejal','Emperador romano','Papa necesariamente','Propietario de todos los medios'],a:0,why:'El dirigente local actúa en el municipio o barrio y puede ser concejal o intendente.',key:'Dirigentes'},
{id:'p06',t:'pa',q:'¿Quién maneja recursos importantes y redes de poder de un partido?',o:['Los simpatizantes por el solo hecho de votar','Los dirigentes partidarios','Todos los televidentes','Los diáconos'],a:1,why:'La guía atribuye esa función a los dirigentes partidarios.',key:'Dirigentes'},
{id:'p07',t:'pa',q:'¿Qué caracteriza especialmente a los líderes partidarios?',o:['Carisma y capacidad para vincularse con dirigentes y medios','Ser necesariamente intendentes','No participar en política','Estar obligatoriamente fuera de las elecciones'],a:0,why:'Se destacan por carisma y relaciones con dirigentes, medios y figuras importantes.',key:'Liderazgo'},
{id:'p08',t:'pa',q:'¿Qué rasgos suelen tener los partidos modernos?',o:['Estructura estable, duradera y jerárquica','Estructura sin organización alguna','Existencia de un solo integrante','Prohibición de tener plataformas'],a:0,why:'La guía describe una estructura relativamente estable, duradera y jerárquica.',key:'Estructura'},
{id:'p09',t:'pa',q:'El Partido Autonomista Nacional (PAN), durante el período de notables, estaba asociado a...',o:['Élite económica agroexportadora, participación restringida y fraude','Movimiento de trabajadores liderado por Perón','Lucha contra el fraude impulsada por Yrigoyen','El Concilio Vaticano II'],a:0,why:'El PAN representó una política de notables ligada a la élite agroexportadora y recurrió al fraude.',key:'PAN'},
{id:'p10',t:'pa',q:'¿De qué organización surgió la UCR y en qué año fue creada esa organización?',o:['De la Unión Cívica, creada en 1889','Del PAN, creado en 1946','Del PJ, creado en 1916','Del Concilio de Trento, creado en 1912'],a:0,why:'La Unión Cívica Radical surgió de la Unión Cívica, creada en 1889.',key:'UCR'},
{id:'p11',t:'pa',q:'¿Qué buscaba la UCR en sus orígenes?',o:['Combatir el fraude y democratizar la política','Restringir todavía más el voto','Establecer el derecho canónico','Reforzar la autoridad imperial'],a:0,why:'La UCR se planteó combatir el fraude electoral y democratizar la participación política.',key:'UCR'},
{id:'p12',t:'pa',q:'¿Qué estableció la Ley Sáenz Peña de 1912, según la guía?',o:['Voto universal masculino, secreto y obligatorio','Voto exclusivamente público y voluntario','La presidencia de Perón','La creación de sindicatos'],a:0,why:'La guía señala específicamente voto universal masculino, secreto y obligatorio.',key:'1912'},
{id:'p13',t:'pa',q:'¿Quién llegó a la presidencia argentina en 1916?',o:['Juan Domingo Perón','Hipólito Yrigoyen','Gregorio VII','Constantino'],a:1,why:'Hipólito Yrigoyen accedió a la presidencia en 1916.',key:'1916'},
{id:'p14',t:'pa',q:'¿En qué año fue elegido presidente Juan Domingo Perón?',o:['1889','1912','1916','1946'],a:3,why:'Perón fue elegido presidente en 1946 y su movimiento dio origen al Partido Justicialista.',key:'1946'},
{id:'p15',t:'pa',q:'¿En qué sectores sociales se apoyó especialmente el peronismo según la guía?',o:['En los trabajadores y sectores populares','Únicamente en la élite agroexportadora','En los obispos y diáconos','Exclusivamente en propietarios de medios'],a:0,why:'La guía señala la base de trabajadores y sectores populares, con participación por voto, manifestaciones y militancia.',key:'PJ'},
{id:'p16',t:'pa',q:'¿Cuáles son los tres pilares doctrinarios del justicialismo?',o:['Orden, progreso y jerarquía','Justicia social, independencia económica y soberanía política','Rating, audiencia y propaganda','Autoridad, imperio y derecho canónico'],a:1,why:'Estos son los tres pilares mencionados literalmente por la guía.',key:'Tres pilares'},
{id:'p17',t:'pa',q:'¿Qué tres formas de participación del justicialismo destaca la guía?',o:['Voto, manifestaciones y militancia','Solo manifestaciones','Derecho canónico, comunión y disciplina','Rating, prensa y obispados'],a:0,why:'El material menciona voto, manifestaciones y militancia como formas de participación política.',key:'Participación PJ'},
// Iglesia — fuente: sección 3
{id:'i01',t:'ig',q:'¿Cómo caracteriza la guía la autoridad dentro de la Iglesia?',o:['Como un servicio','Como una forma de ganar rating','Como una ficha de afiliación','Como ausencia absoluta de gobierno'],a:0,why:'La autoridad eclesial se entiende como servicio, en equilibrio con la autonomía personal.',key:'Autoridad'},
{id:'i02',t:'ig',q:'¿Con qué debe encontrar un punto de encuentro la autoridad eclesiástica?',o:['Con la autonomía personal en una comunidad de comunión','Con el fraude electoral','Con las plataformas partidarias','Con la selección de noticias'],a:0,why:'Autoridad y autonomía personal deben encontrarse dentro de la Iglesia como comunidad de comunión.',key:'Autonomía'},
{id:'i03',t:'ig',q:'¿Quiénes dirigían especialmente las primeras comunidades cristianas?',o:['Intendentes y concejales','Obispos y diáconos','Presidentes y ministros','Afiliados y simpatizantes'],a:1,why:'Las primeras comunidades cristianas contaban con dirigentes, especialmente obispos y diáconos.',key:'Orígenes'},
{id:'i04',t:'ig',q:'¿Qué ocurrió con la relación Iglesia-Imperio romano bajo Constantino?',o:['Se estrechó y el emperador apoyó la expansión del cristianismo','Desapareció toda relación','Se sancionó la Ley Sáenz Peña','Se creó el justicialismo'],a:0,why:'El emperador intervino en asuntos eclesiásticos y apoyó la expansión del cristianismo.',key:'Constantino'},
{id:'i05',t:'ig',q:'¿Por qué surgieron tensiones entre el poder imperial y la Iglesia?',o:['Por la intervención del emperador en cuestiones eclesiásticas','Por el rating de la radio','Por las fichas partidarias','Por la elección de Yrigoyen'],a:0,why:'La intromisión del poder imperial en cuestiones propias de la Iglesia generó conflictos.',key:'Poder imperial'},
{id:'i06',t:'ig',q:'¿Qué disputa marcó la relación entre Iglesia y gobernantes durante la Edad Media?',o:['Conflictos entre la autoridad del Papa y los poderes políticos','El conflicto por la Ley Sáenz Peña','La competencia entre emisoras de televisión','La creación de la Unión Cívica'],a:0,why:'La guía destaca tensiones entre el poder del Papa y el de los gobernantes.',key:'Edad Media'},
{id:'i07',t:'ig',q:'¿Qué buscó fortalecer el Papa Gregorio VII?',o:['La autoridad universal del Papa','El fraude electoral argentino','La autoridad de los medios sobre partidos','La disciplina del Concilio Vaticano II'],a:0,why:'Durante su pontificado se buscó reforzar la autoridad universal papal.',key:'Gregorio VII'},
{id:'i08',t:'ig',q:'¿Qué es el derecho canónico?',o:['El conjunto de normas jurídicas propias de la Iglesia','Las reglas para presentar plataformas electorales','El voto secreto y obligatorio','La agenda de los medios'],a:0,why:'Derecho canónico = normas jurídicas propias de la Iglesia.',key:'Derecho canónico'},
{id:'i09',t:'ig',q:'¿Qué impulsó el Concilio de Trento?',o:['Reformas de disciplina y organización eclesiástica','La elección de Perón','La creación de la Unión Cívica','La agenda setting'],a:0,why:'El Concilio de Trento impulsó reformas internas relacionadas con disciplina y organización.',key:'Trento'},
{id:'i10',t:'ig',q:'¿Qué tendencia se reforzó durante el siglo XIX dentro de la Iglesia?',o:['Centralización de la autoridad en el Papa','Disolución de todas las instituciones','Eliminación del derecho canónico','Participación electoral de simpatizantes'],a:0,why:'La guía destaca una centralización creciente de la autoridad papal.',key:'Siglo XIX'},
{id:'i11',t:'ig',q:'¿Qué afirmó el Concilio Vaticano I?',o:['Primado jurisdiccional del Papa e infalibilidad en condiciones determinadas','La Ley Sáenz Peña','El surgimiento del PAN','La abolición de toda autoridad eclesial'],a:0,why:'Vaticano I afirmó el primado jurisdiccional papal y el dogma de su infalibilidad con las condiciones correspondientes.',key:'Vaticano I'},
{id:'i12',t:'ig',q:'¿Qué propuso el Concilio Vaticano II?',o:['Una nueva manera de relacionar a la Iglesia con el mundo contemporáneo','La creación del Imperio romano','Un partido político agroexportador','La afiliación obligatoria a partidos'],a:0,why:'Vaticano II propuso una nueva relación de la Iglesia con el mundo contemporáneo.',key:'Vaticano II'},
{id:'i13',t:'ig',q:'En la guía, la comunión destaca a la Iglesia como...',o:['Una comunidad con participación y corresponsabilidad de sus miembros','Una empresa de noticias','Una organización de notables agroexportadores','Una estructura sin misión compartida'],a:0,why:'La comunión es central: participación y corresponsabilidad en la misión eclesial.',key:'Comunión'},
{id:'i14',t:'ig',q:'¿Cuál es la conclusión histórica sobre el poder en la Iglesia?',o:['La relación entre autoridad religiosa y poder político generó conflictos y transformaciones','Nunca hubo conflictos entre Iglesia y gobernantes','El poder papal fue idéntico en todas las épocas','La historia de la Iglesia empieza en 1946'],a:0,why:'El material concluye que el poder eclesial cambió históricamente y que la autoridad debe concebirse como servicio.',key:'Síntesis'}
];

function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

${history.length?`<div class="surface accent-panel" style="padding:21px;margin-top:24px;display:flex;gap:15px;justify-content:space-between;flex-wrap:wrap;align-items:center"><div><strong>Tu último intento: ${history.at(-1).score}/${history.at(-1).total}</strong><div class="sm muted" style="margin-top:5px">Tus avances siguen guardados en este navegador.</div></div><button class="btn secondary mini-btn" onclick="navigate('progress')">Ver evolución</button></div>`:''}`}
function learnContent(t){if(t==='op')return `<h3>¿Qué es la opinión pública?</h3><p>Son los juicios, ideas y puntos de vista que las personas expresan en el ámbito común sobre asuntos de interés para la sociedad.</p><div class="info-strip"><strong>Ejemplo:</strong> los vecinos opinan públicamente acerca de la gestión de las inundaciones. No necesitan pertenecer a un partido para participar políticamente.</div><h4 class="topic-title">Para qué sirve</h4><div class="split-cards"><div class="fact"><strong>Expresar y debatir</strong><span>Permite manifestar opiniones diferentes y discutir temas públicos.</span></div><div class="fact"><strong>Controlar y legitimar</strong><span>La ciudadanía puede observar, cuestionar y respaldar acciones gubernamentales.</span></div></div><h4 class="topic-title">Información y agenda setting</h4><p>La opinión pública se construye con la información que reciben los ciudadanos y sus propios juicios. Radio, TV, diarios e Internet <strong>seleccionan y presentan noticias</strong>. La <strong>agenda setting</strong> explica que los temas que los medios destacan pueden volverse importantes para la población.</p><div class="info-strip">Regla para memorizar: <strong>opinión pública = participación</strong>; <strong>agenda setting = selección de temas importantes</strong>.</div><h4 class="topic-title">Intereses que pueden influir en los medios</h4><p>La búsqueda de rating, los intereses de los propietarios y la visión de la realidad de esos propietarios y los sectores con los que se relacionan.</p>`;if(t==='pa')return `<h3>¿Qué son los partidos políticos?</h3><p>Son organizaciones que canalizan intereses, presentan plataformas políticas con ideas y objetivos, intervienen en decisiones de gobierno y buscan ocupar cargos de poder. Su existencia expresa el <strong>pluralismo</strong>, es decir, distintas ideas e intereses dentro de la sociedad.</p><h4 class="topic-title">La estructura de un partido</h4><div class="split-cards"><div class="fact"><strong>Simpatizantes</strong><span>Se identifican con un partido y suelen votarlo.</span></div><div class="fact"><strong>Afiliados</strong><span>Se comprometen formalmente mediante una ficha de afiliación.</span></div><div class="fact"><strong>Dirigentes locales</strong><span>Municipio y barrio: pueden ocupar cargos como concejal o intendente.</span></div><div class="fact"><strong>Dirigentes partidarios</strong><span>Manejan recursos importantes y redes de poder.</span></div><div class="fact"><strong>Líderes partidarios</strong><span>Se distinguen por su carisma y relaciones con otras figuras.</span></div><div class="fact"><strong>Partidos modernos</strong><span>Estructura relativamente estable, duradera y jerárquica.</span></div></div><h4 class="topic-title">Las fechas que necesitás dominar</h4><div class="timeline"><div class="timeline-row"><b>PAN</b><span>Partido de notables: élite agroexportadora, participación restringida y fraude electoral.</span></div><div class="timeline-row"><b>1889</b><span>Se crea la Unión Cívica, de la que surgió la UCR. Objetivo: combatir fraude y democratizar política.</span></div><div class="timeline-row"><b>1912</b><span>Ley Sáenz Peña: voto universal masculino, secreto y obligatorio.</span></div><div class="timeline-row"><b>1916</b><span>Hipólito Yrigoyen es presidente.</span></div><div class="timeline-row"><b>1946</b><span>Perón es elegido presidente. El PJ se origina en su movimiento, con base en trabajadores y sectores populares y participación mediante voto, manifestaciones y militancia.</span></div></div><div class="info-strip"><strong>Los tres pilares del PJ:</strong> justicia social · independencia económica · soberanía política.</div>`;return `<h3>La autoridad como servicio</h3><p>Según la guía, la autoridad dentro de la Iglesia debe comprenderse como <strong>servicio</strong>, en equilibrio con la autonomía personal y con la idea de una Iglesia entendida como <strong>comunidad de comunión</strong>.</p><h4 class="topic-title">Recorrido histórico del poder eclesial</h4><div class="timeline"><div class="timeline-row"><b>Inicio</b><span>Las comunidades cristianas tenían dirigentes: especialmente obispos y diáconos.</span></div><div class="timeline-row"><b>Imperio</b><span>Con Constantino se estrechó la relación con el Imperio romano. El emperador apoyó la expansión del cristianismo e intervino en asuntos eclesiásticos, causando tensiones.</span></div><div class="timeline-row"><b>Medievo</b><span>Hubo disputas entre papas y gobernantes. Gregorio VII buscó reforzar la autoridad universal del Papa. Se desarrolló el derecho canónico.</span></div><div class="timeline-row"><b>Trento</b><span>Impulsó reformas en la disciplina y organización de la Iglesia.</span></div><div class="timeline-row"><b>S. XIX</b><span>Aumentó la centralización papal. Vaticano I afirmó el primado jurisdiccional y la infalibilidad papal en ciertas condiciones.</span></div><div class="timeline-row"><b>Vaticano II</b><span>Propuso una nueva relación entre la Iglesia y el mundo contemporáneo.</span></div></div><div class="split-cards"><div class="fact"><strong>Derecho canónico</strong><span>Conjunto de normas jurídicas propias de la Iglesia.</span></div><div class="fact"><strong>Comunión</strong><span>Comunidad con participación y corresponsabilidad de sus miembros en la misión eclesial.</span></div></div><div class="info-strip">Idea clave: la relación entre la autoridad religiosa y el poder político provocó <strong>conflictos y transformaciones</strong> a través de la historia.</div>`}
function learn(){return `<div class="section-head"><div><div class="eyebrow">FASE 01 · COMPRENDER</div><h2>Repaso esencial</h2><p class="page-intro">Leé cada bloque una vez. Después andá a las tarjetas para recuperar las respuestas sin volver a mirar.</p></div></div><div class="learn-layout"><aside class="surface learning-menu">${[['op','01','Opinión pública'],['pa','02','Partidos políticos'],['ig','03','Poder en la Iglesia']].map(([t,n,s])=>`<button class="unit-selector ${unit===t?'active':''}" onclick="unit='${t}';render()"><span>${n}</span> ${s}</button>`).join('')}</aside><article class="surface lesson"><div class="eyebrow ${TOPICS[unit].color}">UNIDAD ${unit==='op'?'01':unit==='pa'?'02':'03'}</div>${learnContent(unit)}<div class="lesson-footer"><button class="btn primary" onclick="navigate('flash')">Recuperar sin mirar →</button><button class="btn secondary" onclick="startExam('fast')">Rendir simulacro</button></div></article></div>`}
function examStart(){return `<div class="section-head"><div><div class="eyebrow">FASE 02 · PONER A PRUEBA</div><h2>Elegí cómo querés rendir</h2><p class="page-intro">Las preguntas alternan temas, ofrecen corrección explicada y registran cuáles necesitás repasar. Respondé antes de mirar cualquier pista.</p></div></div><div class="exam-start"><div class="surface choice-panel accent-panel"><div class="pill">RECOMENDADO · 15 MIN</div><h3>Sprint de evaluación</h3><p>Las <strong>25 preguntas fundamentales</strong> del material, mezcladas. Ideal si la prueba está cerca y necesitás una revisión activa.</p><div class="feature-list"><div>✓ Preguntas intercaladas de las 3 unidades</div><div>✓ Corrección y explicación inmediata</div><div>✓ Repaso posterior de errores</div></div><button class="btn primary" onclick="startExam('fast')">Comenzar sprint →</button></div><div class="surface choice-panel"><div class="pill gray">COBERTURA MÁXIMA</div><h3>Examen completo</h3><p><strong>43 preguntas</strong> sobre todo el contenido desarrollado en la guía. Para asegurarte de que no te queda ningún concepto sin practicar.</p><div class="feature-list"><div>✓ Fechas, definiciones y casos prácticos</div><div>✓ 12 + 17 + 14 preguntas por tema</div><div>✓ Diagnóstico por unidad</div></div><button class="btn secondary" onclick="startExam('full')">Comenzar examen completo →</button></div></div><div class="surface" style="margin-top:17px;padding:20px"><strong>Importante:</strong> <span class="sm muted">el porcentaje de opción múltiple no demuestra por sí solo dominio completo. Al terminar, hacé las cuatro respuestas abiertas sin ayuda.</span></div>`}
function startExam(mode,reviewIds){const pool=reviewIds?QUESTIONS.filter(q=>reviewIds.includes(q.id)):mode==='fast'?QUESTIONS.filter(q=>FAST_IDS.includes(q.id)):QUESTIONS;const items=interleave(pool);exam={mode:reviewIds?'review':mode,items:items.map(q=>q.id),idx:0,choice:null,confidence:null,checked:false,answers:[],startedAt:Date.now(),elapsed:0,finished:false,optionOrder:Object.fromEntries(items.map(q=>[q.id,shuffle(q.o.map((_,j)=>j))]))};view='exam';navLinks();render();window.scrollTo(0,0)}
function currentQuestion(){return QUESTIONS.find(q=>q.id===exam.items[exam.idx])}
function examQuestion(){const q=currentQuestion(),i=exam.idx,total=exam.items.length,answer=exam.choice,right=exam.checked&&answer===q.a,order=exam.optionOrder[q.id];const all=exam.answers;let completed=all.filter(a=>a.correct).length;return `<div class="section-head"><div><div class="eyebrow">FASE 02 · RECUPERACIÓN ACTIVA</div><h2>${exam.mode==='review'?'Repará tus errores':exam.mode==='fast'?'Sprint de 15 minutos':'Examen completo'}</h2></div><button class="btn secondary mini-btn" onclick="if(confirm('¿Salir de este intento? El intento sin terminar no se guardará.')){exam=null;navigate('exam')}">Salir</button></div><div class="question-layout"><section class="surface question-card"><div class="qid-row">${tag(q.t)}<div class="qcount">PREGUNTA ${String(i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div></div><div class="progressbar" role="progressbar" aria-valuenow="${i+1}" aria-valuemin="0" aria-valuemax="${total}"><div style="width:${((i+1)/total)*100}%"></div></div><div class="eyebrow" style="color:var(--sub)">INTENTÁ RECORDAR ANTES DE ELEGIR</div><h2>${esc(q.q)}</h2><div class="options">${order.map((n,j)=>{const opt=q.o[n];let st='';if(exam.checked){st=n===q.a?'right':n===answer?'wrong':''}else if(n===answer)st='selected';return `<button class="option ${st}" ${exam.checked?'disabled':''} onclick="selectAnswer(${n})" aria-pressed="${n===answer}"><span class="letter">${'ABCD'[j]}</span><span class="option-text">${esc(opt)}</span>${exam.checked&&n===q.a?'✓':''}</button>`}).join('')}</div>${!exam.checked?`<div class="confidence"><div class="conf-label">¿Qué tan seguro estás? (para detectar falsa confianza)</div><div class="conf-row">${[['low','No estoy seguro'],['mid','Tengo dudas'],['high','Muy seguro']].map(([k,l])=>`<button class="conf-btn ${exam.confidence===k?'active':''}" aria-pressed="${exam.confidence===k}" onclick="exam.confidence='${k}';render()">${l}</button>`).join('')}</div></div>`:`<div class="feedback ${right?'good':'bad'}" role="status"><strong>${right?'✓ ¡Bien! Respuesta correcta.':'↻ Este concepto necesita repaso.'}</strong>${esc(q.why)}${!right&&exam.confidence==='high'?'<div style="margin-top:9px;color:var(--gold);font-weight:750">Atención: estabas muy seguro. Este error puede ser especialmente engañoso.</div>':''}</div>`}<div class="question-actions"><span class="sm muted">${exam.checked?right?'Punto sumado':'Lo volverás a ver en el repaso':`Tecla rápida: ${q.o.length===4?'1–4':'1–3'}`}</span>${exam.checked?`<button class="btn primary" onclick="nextQuestion()">${i===total-1?'Ver mi diagnóstico':'Siguiente pregunta'} →</button>`:`<button class="btn primary" onclick="checkAnswer()" ${answer===null?'disabled':''}>Comprobar respuesta →</button>`}</div></section><aside class="surface exam-side"><div class="eyebrow">RELOJ DE ESTUDIO</div><div id="clock" class="clock">${formatTime(exam.elapsed)}</div><p>${exam.mode==='fast'?'Objetivo: una sesión de aproximadamente 15 minutos. Si tardás más, podés terminar igual.':'Usá el tiempo que necesites. Priorizá respuestas pensadas.'}</p><div class="balance"><h3 style="grid-column:1/-1">Tu progreso</h3>${Object.entries(TOPICS).map(([t,v])=>{const subset=all.filter(a=>a.t===t);const n=subset.length?Math.round(subset.filter(a=>a.correct).length/subset.length*100):0;return `<div><div class="row"><span class="${v.color}">${v.short}</span><strong>${n}%</strong></div><div class="micro-bar"><i style="width:${n}%;background:${v.accent}"></i></div></div>`}).join('')}</div><p style="margin-top:21px"><strong>${completed}</strong> respuestas correctas hasta ahora.</p></aside></div>`}
function selectAnswer(i){if(!exam||exam.checked)return;exam.choice=i;render()}
function checkAnswer(){if(!exam||exam.checked||exam.choice===null)return;const q=currentQuestion();exam.checked=true;exam.answers.push({id:q.id,t:q.t,key:q.key,correct:q.a===exam.choice,choice:exam.choice,confidence:exam.confidence||'unset'});render()}
function nextQuestion(){if(!exam||!exam.checked)return;if(exam.idx+1===exam.items.length){finishExam();return}exam.idx++;exam.choice=null;exam.confidence=null;exam.checked=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function finishExam(){exam.finished=true;exam.elapsed=Math.floor((Date.now()-exam.startedAt)/1000);const score=exam.answers.filter(a=>a.correct).length;const item={when:new Date().toISOString(),score,total:exam.items.length,mode:exam.mode,secs:exam.elapsed,answers:exam.answers};saved.history=(saved.history||[]).concat([item]).slice(-25);saved.last=item;persist();exam=null;view='progress';navLinks();render();window.scrollTo(0,0)}
function timeText(sec){const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`}
function formatTime(s){return timeText(s||0)}
function getBad(){const latest=saved.last;return latest?latest.answers.filter(a=>!a.correct):[]}
function scoreLabel(per){return per>=90?'Muy sólido':per>=70?'Buen camino':per>=50?'Necesita refuerzo':'Volvé a practicar'}
function progress(){const last=saved.last;const hist=saved.history||[];if(!last)return `<div class="section-head"><div><div class="eyebrow">FASE 04 · EVALUACIÓN REAL</div><h2>Tu progreso</h2></div></div><div class="surface empty"><h3>Todavía no hay resultados</h3><p>Completá un sprint o examen para ver en qué temas acertás y cuáles conviene repasar.</p><button class="btn primary" onclick="startExam('fast')">Empezar mi primera prueba →</button></div>${openSection()}`;const score=last.score,total=last.total,per=pct(100*score/total);const bad=getBad();const falseConfidence=last.answers.filter(a=>!a.correct&&a.confidence==='high');return `<div class="section-head"><div><div class="eyebrow">FASE 04 · FEEDBACK Y PLAN PERSONAL</div><h2>Tu diagnóstico</h2></div><button class="btn secondary mini-btn" onclick="downloadReport()">↓ Exportar resultados</button></div><section class="surface result-hero"><div><div class="eyebrow">ÚLTIMO INTENTO · ${esc(last.mode==='fast'?'SPRINT':last.mode==='full'?'EXAMEN COMPLETO':'REPASO DE ERRORES')}</div><h2>${scoreLabel(per)}</h2><p>Acertaste <strong style="color:white">${score} de ${total}</strong> preguntas (${per}%). ${bad.length?'Repasá las respuestas falladas y volvé a explicarlas con tus palabras.':'Todas las respuestas fueron correctas; confirmá el dominio con las consignas de desarrollo de abajo.'} <br><span class="sm">Tiempo de práctica: ${timeText(last.secs)}. El porcentaje refleja este intento, no una nota escolar automática.</span></p><div class="hero-actions"><button class="btn primary" onclick="${bad.length?`startExam('fast',${JSON.stringify(bad.map(a=>a.id)).replace(/"/g,'&quot;')})`:`navigate('flash')`}">${bad.length?'Reintentar mis errores':'Practicar con tarjetas'} →</button><button class="btn secondary" onclick="startExam('full')">Hacer examen completo</button></div></div><div class="score-ring" style="--pct:${per}%"><div class="score-inner"><b>${per}%</b><small>${score} / ${total}</small></div></div></section><div class="breakdown">${Object.entries(TOPICS).map(([t,v])=>{const ans=last.answers.filter(a=>a.t===t),ok=ans.filter(a=>a.correct).length;return `<div class="surface"><div class="label ${v.color}">${v.name}</div><strong>${ok}<span class="muted" style="font-size:18px">/${ans.length}</span></strong><div class="progressbar" style="margin:12px 0 0"><div style="width:${ans.length?100*ok/ans.length:0}%;background:${v.accent}"></div></div></div>`}).join('')}</div>${falseConfidence.length?`<div class="surface" style="padding:18px;border-color:#926577;margin-bottom:16px"><strong style="color:var(--gold)">⚑ ${falseConfidence.length} ${falseConfidence.length===1?'error con alta confianza':'errores con alta confianza'}</strong><p class="sm muted" style="margin-bottom:0">Estas respuestas merecen atención: las creías seguras, pero no eran correctas.</p></div>`:''}<section class="surface" style="padding:25px"><div class="eyebrow">LO QUE TENÉS QUE RECUPERAR</div><h3 style="margin:8px 0 15px;font-size:22px;letter-spacing:-.04em">${bad.length?`${bad.length} concepto${bad.length===1?'':'s'} para reforzar`:'Ningún error en este intento'}</h3>${bad.length?`<div class="result-list">${bad.map(a=>{const q=QUESTIONS.find(v=>v.id===a.id);return `<article class="result-item"><small>${esc(TOPICS[q.t].name)} · ${esc(q.key)}</small><strong>${esc(q.q)}</strong><p><b style="color:var(--ok)">Respuesta correcta:</b> ${esc(q.o[q.a])}<br>${esc(q.why)}</p></article>`}).join('')}</div>`:`<p class="sm muted">Para verificar conocimientos sin el apoyo de alternativas, resolvé las consignas abiertas.</p>`}</section>${openSection()}<div class="surface" style="margin-top:16px;padding:22px"><div class="eyebrow">HISTORIAL EN ESTE DISPOSITIVO</div><div class="sm muted" style="margin-top:10px">${hist.slice(-5).reverse().map(x=>`<div style="border-top:1px solid var(--line);padding:9px 0">${new Date(x.when).toLocaleDateString('es-AR')} · ${x.score}/${x.total} · ${esc(x.mode)}</div>`).join('')}</div></div>`}
function openSection(){const answers=saved.openAnswers||{},grades=saved.openGrades||{};const item=OPEN[openIndex];return `<section class="surface written" id="development"><div class="eyebrow">FASE FINAL · RECUPERACIÓN SIN PISTAS</div><h2 style="font-size:25px;letter-spacing:-.05em;margin:7px 0">Demostrá que podés explicarlo</h2><p class="sm muted" style="line-height:1.7">Estas cuatro consignas son esenciales. Escribí sin consultar el material, revelá los criterios y evaluá si los incluiste. La corrección es tuya: esta página no simula una IA que evalúa el texto.</p><div class="oral-tabs">${OPEN.map((x,i)=>`<button class="oral-tab ${openIndex===i?'active':''}" onclick="saveOpenText();openIndex=${i};render()">${grades[i]==='yes'?'✓ ':''}${i+1}. ${['Opinión','Partidos','Historia','Iglesia'][i]}</button>`).join('')}</div><h3 style="font-size:19px;letter-spacing:-.035em">${esc(item.title)}</h3><p style="font-size:15px;line-height:1.75;color:#d7e2f7">${esc(item.prompt)}</p><label for="writtenAnswer" class="sm muted">Tu respuesta (escribí de memoria)</label><textarea id="writtenAnswer" class="answerbox" placeholder="Escribí todo lo que recordás, aunque no estés seguro…" oninput="saveOpenText()">${esc(answers[openIndex]||'')}</textarea><div class="lesson-footer"><button class="btn secondary" onclick="toggleRubric()">${window._showRubric?'Ocultar':'Mostrar'} criterios para corregirme</button><button class="btn primary" onclick="saveOpenText();openIndex=(openIndex+1)%4;window._showRubric=false;render()">Siguiente consigna →</button></div>${window._showRubric?`<div class="rubric"><strong>Comprobá que tu respuesta incluya:</strong><ul>${item.rubric.map(v=>`<li>${esc(v)}</li>`).join('')}</ul><div style="margin-top:17px;display:flex;gap:9px;flex-wrap:wrap"><button class="btn mini-btn primary" onclick="gradeOpen('yes')">✓ Puedo explicarlo completo</button><button class="btn mini-btn secondary" onclick="gradeOpen('no')">↻ Todavía tengo dudas</button></div>${grades[openIndex]?`<p class="sm" style="margin:10px 0 0">Estado guardado: ${grades[openIndex]==='yes'?'Lo expliqué':'Debo repasar'}</p>`:''}</div>`:''}</section>`}
function saveOpenText(){const field=document.getElementById('writtenAnswer');if(!field)return;saved.openAnswers=saved.openAnswers||{};saved.openAnswers[openIndex]=field.value;persist()}
function toggleRubric(){saveOpenText();window._showRubric=!window._showRubric;render()}
function gradeOpen(val){saveOpenText();saved.openGrades=saved.openGrades||{};saved.openGrades[openIndex]=val;persist();render()}
function cardDue(c){let ob=(saved.flash||{})[c.id];return !ob||!ob.due||ob.due<=Date.now()}
function prepareDeck(m='all'){flashMode=m;currentDeck=shuffle(FLASH.filter(c=>m==='due'?cardDue(c):true)).map(c=>c.id);cardIndex=0;cardReveal=false}
function flash(){if(!currentDeck.length&&flashMode==='all'&&cardIndex===0)prepareDeck('all');if(cardIndex>=currentDeck.length||!currentDeck.length)return `<div class="section-head"><div><div class="eyebrow">FASE 03 · REPASO ESPACIADO</div><h2>Tarjetas activas</h2></div></div><div class="surface empty"><div style="font-size:42px;color:var(--aqua)">◈</div><h3>${flashMode==='due'?'No tenés tarjetas pendientes':'Terminaste esta tanda'}</h3><p>${flashMode==='due'?'Lo que recordaste se programó para repasar más adelante.':'Podés practicar otra vez o ver solo las tarjetas cuyo repaso está pendiente.'}</p><div class="hero-actions" style="justify-content:center"><button class="btn primary" onclick="prepareDeck('all');render()">Practicar todas</button><button class="btn secondary" onclick="prepareDeck('due');render()">Ver pendientes</button></div></div>`;const c=FLASH.find(x=>x.id===currentDeck[cardIndex]);const pending=FLASH.filter(cardDue).length;return `<div class="section-head"><div><div class="eyebrow">FASE 03 · RECUPERAR DE MEMORIA</div><h2>Tarjetas de estudio</h2><p class="page-intro">Intentá responder en voz alta ANTES de revelar la tarjeta. El objetivo no es reconocer la respuesta: es poder producirla.</p></div></div><div class="flash-layout"><section class="surface flash-card"><div><div class="qid-row">${tag(c.t)}<span class="qcount">${cardIndex+1} / ${currentDeck.length}</span></div><div class="progressbar"><div style="width:${(cardIndex+1)/currentDeck.length*100}%"></div></div><div class="eyebrow">DECILO O ESCRIBILO SIN MIRAR</div><h2>${esc(c.q)}</h2></div><div>${cardReveal?`<div class="flash-reveal">${esc(c.a)}</div><div class="conf-label">¿LO RECORDASTE ANTES DE REVELAR?</div><div class="hero-actions" style="margin-top:9px"><button class="btn secondary" onclick="gradeFlash(false)">No · repetir pronto</button><button class="btn primary" onclick="gradeFlash(true)">Sí · espaciar repaso</button></div>`:`<button class="btn primary" onclick="cardReveal=true;render()">Mostrar la respuesta →</button>`}</div></section><aside class="surface flash-sidebar"><h3>Aprender > Reconocer</h3><p>Para mejorar la retención, primero intentá recuperar la respuesta. Revelá solo después de pensarlo.</p><div class="result-item"><small>Repaso espaciado</small><strong>${pending} de ${FLASH.length} tarjetas disponibles hoy</strong><p>Cuando recordás, la tarjeta se agenda de forma orientativa para 1, 3 o 7 días según tus aciertos. Si fallás, vuelve a quedar pendiente.</p></div><div class="hero-actions"><button class="btn mini-btn secondary" onclick="prepareDeck('due');render()">Solo pendientes</button><button class="btn mini-btn quiet" onclick="prepareDeck('all');render()">Todas</button></div><p>Los plazos son una ayuda de organización, no garantizan el aprendizaje ni envían notificaciones.</p></aside></div>`}
function gradeFlash(success){const id=currentDeck[cardIndex];saved.flash=saved.flash||{};const old=saved.flash[id]||{level:0};const level=success?Math.min(3,old.level+1):0;const delays=[0,1,3,7];saved.flash[id]={level,due:Date.now()+delays[level]*24*3600*1000,last:Date.now(),success};persist();cardIndex++;cardReveal=false;render()}
function reportText(){const last=saved.last;let t='ÉTICA LAB — RESUMEN DE ESTUDIO\nFormación Ética y Ciudadana\n';if(last){t+=`Último intento: ${last.score}/${last.total} (${pct(last.score/last.total*100)}%).\n`;for(const [k,v] of Object.entries(TOPICS)){const a=last.answers.filter(x=>x.t===k);t+=`${v.name}: ${a.filter(x=>x.correct).length}/${a.length}\n`}const bad=last.answers.filter(x=>!x.correct);t+=`Errores que debo reforzar: ${bad.length}\n`;for(const a of bad){const q=QUESTIONS.find(x=>x.id===a.id);t+=`- ${q.q} → ${q.o[q.a]}\n`}}else t+='Aún sin intentos.\n';t+='\nConsignas abiertas:\n';OPEN.forEach((x,i)=>t+=`${i+1}. ${x.title}: ${(saved.openGrades||{})[i]==='yes'?'Dominada':(saved.openGrades||{})[i]==='no'?'Pendiente':'Sin comprobar'}\n`);return t}
function downloadReport(){const text=reportText();const blob=new Blob([text],{type:'text/plain;charset=utf-8'});downloadBlob(blob,'resultado_etica_ciudadana.txt')}
function downloadBlob(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function openShare(){document.getElementById('modal').className='dialog-backdrop';document.getElementById('modal').innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="shareTitle"><div class="eyebrow">UNA PRUEBA COMPARTIBLE</div><h3 id="shareTitle">Compartí Ética Lab</h3><p>Este sitio es un solo archivo HTML. La otra persona puede abrirlo en un navegador y estudiar sin Internet, sin cuenta y sin instalar nada.</p><ol><li>Tocá <strong>“Compartir el archivo”</strong> o descargá una copia.</li><li>Mandalo por WhatsApp, AirDrop, correo o como documento.</li><li>Quien lo reciba debe <strong>abrir el archivo en su navegador</strong> para usar los botones.</li></ol><div class="hero-actions"><button class="btn primary" onclick="shareFile()">⇧ Compartir el archivo</button><button class="btn secondary" onclick="downloadApp()">↓ Descargar HTML</button></div><p class="xs">Cada persona tendrá sus propios resultados, guardados solo en su dispositivo/navegador. Para tener un enlace público hace falta publicar el archivo en un servicio de alojamiento web.</p><button class="btn quiet" style="width:100%;margin-top:8px" onclick="closeModal()">Cerrar</button></div>`;document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()})}
function closeModal(){document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}
function downloadApp(){const blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML.replace(/^<!doctype html>\s*/i,'')],{type:'text/html;charset=utf-8'});downloadBlob(blob,'Etica_Lab_Prueba_Interactiva.html')}
async function shareFile(){const html='<!doctype html>\n'+document.documentElement.outerHTML;const file=new File([html],'Etica_Lab_Prueba_Interactiva.html',{type:'text/html'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Ética Lab · Prueba interactiva'});return}catch(e){if(e.name==='AbortError')return}}downloadApp();alert('Se descargó una copia del archivo. Podés enviarla como documento por WhatsApp o correo.')}
function footer(){return `<footer class="foot"><div>Ética Lab · Basado en la <em>Guía de estudio de Formación Ética y Ciudadana</em> suministrada para esta evaluación. No incluye desarrollo de Fuerzas Armadas, sindicatos ni administración pública, porque la guía aclara que no tiene su material.</div><div><a href="https://doi.org/10.1177/1529100612453266" target="_blank" rel="noopener">Investigación sobre técnicas de estudio</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/16719566/" target="_blank" rel="noopener">Repaso distribuido</a></div></footer>`}
function render(){navLinks();const app=document.getElementById('app');let html;if(view==='home')html=home();else if(view==='learn')html=learn();else if(view==='exam')html=exam?examQuestion():examStart();else if(view==='flash')html=flash();else html=progress();app.innerHTML=html+footer();if(view==='exam'&&exam){updateClock()}}
function updateClock(){if(!exam)return;exam.elapsed=Math.floor((Date.now()-exam.startedAt)/1000);const el=document.getElementById('clock');if(el){el.textContent=timeText(exam.elapsed);el.classList.toggle('warn',exam.mode==='fast'&&exam.elapsed>=900)}}
setInterval(updateClock,1000);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.target.matches('input,textarea,select')||!exam||view!=='exam')return;if(!exam.checked&&['1','2','3','4'].includes(e.key)){const n=Number(e.key)-1;if(n<currentQuestion().o.length)selectAnswer(exam.optionOrder[currentQuestion().id][n])}else if(e.key==='Enter'){if(exam.checked)nextQuestion();else checkAnswer()}});
render();
</script>
